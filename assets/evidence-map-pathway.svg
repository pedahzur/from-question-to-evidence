<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title description">
  <title id="title">Seven-stage evidence-map pathway</title>
  <desc id="description">A pathway from framing a question through decomposing it, mapping sources, searching, evaluating, testing coverage, and freezing a dated evidence map. Dashed arrows show that gaps can reopen earlier decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6f8792"/>
    </marker>
    <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b46618"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#142735" flood-opacity=".12"/>
    </filter>
    <style>
      .label { font: 700 28px Georgia, serif; fill: #142735; }
      .artifact { font: 600 18px Arial, sans-serif; fill: #49616d; }
      .number { font: 800 18px Arial, sans-serif; fill: #ffffff; }
      .loop { font: 700 17px Arial, sans-serif; fill: #8b4e12; }
      .node { fill: #ffffff; stroke: #b9c9ce; stroke-width: 2; }
      .badge { fill: #0f766e; }
      .path { fill: none; stroke: #6f8792; stroke-width: 4; marker-end: url(#arrow); }
      .return { fill: none; stroke: #b46618; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-warm); }
    </style>
  </defs>

  <rect width="1400" height="600" rx="30" fill="#f5f3ed"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2.5" fill="#0f766e">FROM QUESTION TO EVIDENCE MAP</text>
  <text x="70" y="112" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#142735">An ordered pathway with documented returns</text>

  <path class="path" d="M344 226 H390"/>
  <path class="path" d="M664 226 H710"/>
  <path class="path" d="M984 226 H1030"/>
  <path class="path" d="M1170 292 V348 H984"/>
  <path class="path" d="M710 446 H664"/>
  <path class="path" d="M390 446 H344"/>

  <g filter="url(#shadow)">
    <rect class="node" x="70" y="160" width="274" height="132" rx="20"/>
    <circle class="badge" cx="108" cy="199" r="22"/>
    <text class="number" x="108" y="205" text-anchor="middle">1</text>
    <text class="label" x="140" y="207">Frame</text>
    <text class="artifact" x="100" y="254">Question frame</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="390" y="160" width="274" height="132" rx="20"/>
    <circle class="badge" cx="428" cy="199" r="22"/>
    <text class="number" x="428" y="205" text-anchor="middle">2</text>
    <text class="label" x="460" y="207">Decompose</text>
    <text class="artifact" x="420" y="254">Concept grid</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="710" y="160" width="274" height="132" rx="20"/>
    <circle class="badge" cx="748" cy="199" r="22"/>
    <text class="number" x="748" y="205" text-anchor="middle">3</text>
    <text class="label" x="780" y="207">Map sources</text>
    <text class="artifact" x="740" y="254">Source inventory</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="1030" y="160" width="274" height="132" rx="20"/>
    <circle class="badge" cx="1068" cy="199" r="22"/>
    <text class="number" x="1068" y="205" text-anchor="middle">4</text>
    <text class="label" x="1100" y="207">Search</text>
    <text class="artifact" x="1060" y="254">Search and AI log</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="710" y="380" width="274" height="132" rx="20"/>
    <circle class="badge" cx="748" cy="419" r="22"/>
    <text class="number" x="748" y="425" text-anchor="middle">5</text>
    <text class="label" x="780" y="427">Evaluate</text>
    <text class="artifact" x="740" y="474">Evidence register</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="390" y="380" width="274" height="132" rx="20"/>
    <circle class="badge" cx="428" cy="419" r="22"/>
    <text class="number" x="428" y="425" text-anchor="middle">6</text>
    <text class="label" x="460" y="427">Test coverage</text>
    <text class="artifact" x="420" y="474">Gap analysis</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="70" y="380" width="274" height="132" rx="20" stroke="#b46618" stroke-width="3"/>
    <circle cx="108" cy="419" r="22" fill="#b46618"/>
    <text class="number" x="108" y="425" text-anchor="middle">7</text>
    <text class="label" x="140" y="427">Freeze map</text>
    <text class="artifact" x="100" y="467">Collection plan and</text>
    <text class="artifact" x="100" y="491">stopping rule</text>
  </g>

  <path class="return" d="M527 380 C527 330 527 330 527 296"/>
  <text class="loop" x="550" y="340">Reopen a weak dimension</text>
  <path class="return" d="M847 380 C847 330 847 330 847 296"/>
  <text class="loop" x="870" y="340">Seek an independent stream</text>
</svg>
