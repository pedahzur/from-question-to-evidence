name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto with TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Render manuscript (DOCX and PDF)
        run: quarto render --profile manuscript

      - name: Render site
        run: quarto render --profile site

      - name: Run checks
        run: uv run pytest -q

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
