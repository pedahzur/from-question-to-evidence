project:
  output-dir: build-site
  post-render:
    - uv run python scripts/copy_manuscript_downloads.py
  resources:
    - templates/*.xlsx
    - templates/*.docx
    - assets/evidence-map-pilot.js

book:
  favicon: assets/favicon.svg
  search: true
  page-navigation: true
  downloads:
    - docx
    - pdf
  sharing:
    - linkedin
  sidebar:
    style: docked
    collapse-level: 1

bibliography: bibliography/references.bib
csl: bibliography/styles/chicago-fullnote-bibliography.csl

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 2
    link-external-newwindow: true
    smooth-scroll: true
    include-after-body: assets/evidence-map-pilot-loader.html
